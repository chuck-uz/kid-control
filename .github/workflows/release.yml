name: Release

# Fires on a version tag such as v2.0.0. MinVer (MinVerTagPrefix=v) turns the tag
# into the assembly version, which the self-update path compares against.
on:
  push:
    tags:
      - 'v*'

# A second push to the same tag supersedes the first run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # required to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs full history to resolve the version from the tag.

      # Reject malformed tags early so we never publish a release named "vfoo".
      - name: Validate tag format
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not a valid vMAJOR.MINOR.PATCH[-prerelease] version."
          }
          Write-Host "Releasing tag $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # build.ps1 restores, builds, RUNS THE TESTS, then publishes. Tests run before
      # any artifact is packaged, so a red test blocks the release outright.
      - name: Build, test and publish
        shell: pwsh
        run: .\build.ps1

      # Confirm the tag actually stamped the binaries (catches a missing MinVerTagPrefix).
      - name: Verify stamped version matches tag
        shell: pwsh
        run: |
          $exe = "publish/Installer/KidControl.Installer.exe"
          $fv  = (Get-Item $exe).VersionInfo.ProductVersion
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          Write-Host "Installer ProductVersion=$fv  tag=$tag"
          if (-not $fv.StartsWith($tag)) {
            throw "Binary version '$fv' does not match tag '$tag'. Check MinVerTagPrefix=v and fetch-depth:0."
          }

      # ── Code signing ────────────────────────────────────────────────────────
      # The self-update path executes a downloaded installer AS SYSTEM, so an unsigned
      # (or hash-unverified) installer there is a remote-code-execution vector.
      # UpdateConfig.RequireSignature + TrustedThumbprint only help if releases are
      # actually signed. This signs every KidControl*.exe under publish/ (including the
      # payload copies staged next to the installer), using a cert from repo secrets.
      #
      # Guarded: with no CODE_SIGNING_PFX_BASE64 the step is a clear no-op + warning, so
      # forks still build — but a real release MUST provide it. Unsigned = security risk.
      - name: Sign executables
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Warning "CODE_SIGNING_PFX_BASE64 not set — publishing UNSIGNED binaries. The self-update path trusts signatures; unsigned releases are a security risk."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found on the runner." }

          # Sign every KidControl executable, including the payload copies inside
          # publish/Installer so the zipped setup is fully signed.
          $targets = Get-ChildItem -Path "publish" -Recurse -Filter "KidControl*.exe"
          foreach ($t in $targets) {
            & $signtool sign /f $pfxPath /p $env:PFX_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($t.FullName)" }
          }
          Remove-Item $pfxPath -Force

      # ── Package a single self-contained setup zip ─────────────────────────────
      # publish/Installer already holds the installer + ServiceHost.exe + UiHost.exe
      # (staged by build.ps1), so this zip is a one-download, offline-capable setup.
      - name: Package setup zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "publish/KidControl-Setup-$tag.zip"
          Compress-Archive -Path "publish/Installer/*" -DestinationPath $zip -Force
          # Also publish a fixed-name copy so deploy.bat can fetch the newest via the
          # rate-limit-free URL  .../releases/latest/download/KidControl-Setup.zip
          Copy-Item $zip "publish/KidControl-Setup.zip" -Force
          "KC_SETUP_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Checksums ─────────────────────────────────────────────────────────────
      # Computed AFTER signing so the hashes match exactly what users download.
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = @(
            $env:KC_SETUP_ZIP,
            "publish/Installer/KidControl.Installer.exe",
            "publish/ServiceHost/KidControl.ServiceHost.exe",
            "publish/UiHost/KidControl.UiHost.exe"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($f))"
          }
          $lines | Set-Content -Path "publish/SHA256SUMS.txt" -Encoding ascii
          Get-Content "publish/SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags with a prerelease suffix (v2.0.0-rc1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ env.KC_SETUP_ZIP }}
            publish/KidControl-Setup.zip
            publish/Installer/KidControl.Installer.exe
            publish/ServiceHost/KidControl.ServiceHost.exe
            publish/UiHost/KidControl.UiHost.exe
            publish/SHA256SUMS.txt
