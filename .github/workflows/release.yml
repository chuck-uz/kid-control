name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer requires full git history to resolve version from tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Build/InstallerPublish-Latest/KidControl.Installer.exe
            publish/ServiceHost/KidControl.ServiceHost.exe
            publish/UiHost/KidControl.UiHost.exe
